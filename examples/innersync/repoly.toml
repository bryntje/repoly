# Innersync multi-repo workspace for repoly
# Root: ~/Dev/Projects/Github  (sibling of Innersync.code-workspace)
# Product polyrepos only — not AlphaTradeBot / other unrelated folders.
schema_version = 1

[workspace]
name = "innersync"

[context]
# Always inject platform map + agent rules + informal name aliases
always = [
  "Innersync-meta/CROSS-REPO-CONTEXT.md",
  "Innersync-meta/AGENTS.md",
  "Innersync-meta/NAMING-SCHEMA.md",
]
status_doc = "Innersync-meta/CROSS-REPOStatus.md"

# === Context budget fixes voor realistische Innersync packs ===
max_chars = 120000

# Reserveer 35% van het budget voor geselecteerde repo's (work mode)
repo_reserve_pct = 35

# Hard cap op always-docs zodat er altijd ruimte overblijft voor repo files
always_max_chars = 45000

# ── Cross-repo docs ─────────────────────────────────────────────────────────

[[repos]]
id = "meta"
path = "Innersync-meta"
role = "meta"
tags = [
  "docs",
  "agents",
  "meta",
  "status",
  "naming",
  "naming-schema",
  "propagation",
  "release",
  "security",
]
description = "Cross-repo docs, status, naming schema & propagation rules (META) — single source of truth for naming, agents and release process"

# ── Platform core ───────────────────────────────────────────────────────────

[[repos]]
id = "core"
path = "Innersync_Core"
role = "api"
tags = [
  "backend",
  "api",
  "core",
  "fastapi",
  "payments",
  "mollie",
  "identity",
  "oauth",
  "auth",
  "login",
  "supabase",
  "webhooks",
  "telemetry",
  "vault",
  "memory",
  "agents",
  "hermit",
]
depends_on = []
description = "Core API (api.innersync.tech) + marketing web — payments, /users/me, webhooks, agents proxy"

# ── User-facing apps ────────────────────────────────────────────────────────

[[repos]]
id = "app"
path = "innersync-dashboard"
role = "frontend"
tags = [
  "frontend",
  "app",
  "nextjs",
  "reflections",
  "encryption",
  "oauth",
  "auth",
  "login",
  "identity",
  "profile",
  "teams",
  "vault",
  "memory",
  "agents",
  "grok",
  "supabase",
]
depends_on = ["core", "styling"]
description = "Innersync App (app.innersync.tech) — reflections, OAuth login, profile, vault, Grok chat"

[[repos]]
id = "mind"
path = "alphamind"
role = "frontend"
tags = [
  "frontend",
  "mind",
  "ops",
  "cockpit",
  "telemetry",
  "metrics",
  "railway",
  "identity",
  "auth",
  "login",
  "supabase",
  "nextjs",
]
depends_on = ["core"]
description = "Mind cockpit (mind.innersync.tech) — private ops, metrics, Railway/GitHub status"

[[repos]]
id = "styling"
path = "Innersync_Styling"
role = "lib"
tags = ["ui", "styling", "theme", "design", "tokens", "npm", "lib"]
depends_on = []
description = "@innersync-tech/innersync-ui — shared UI package (no business logic)"

# ── Alphapy (Discord) ───────────────────────────────────────────────────────

[[repos]]
id = "alphapy"
path = "alphapy"
role = "bot"
tags = [
  "discord",
  "bot",
  "alphapy",
  "agents",
  "railway",
  "postgres",
  "fastapi",
  "link",
  "identity",
  "premium",
  "webhooks",
]
depends_on = ["core"]
description = "Alphapy Discord bot + FastAPI — Railway Postgres hot path; agents/link via Core/Supabase"

[[repos]]
id = "alphapy_dashboard"
path = "Alphapy-Dashboard"
role = "frontend"
tags = [
  "frontend",
  "dashboard",
  "control-panel",
  "guild-admin",
  "alphapy",
  "railway",
  "nextjs",
]
depends_on = ["alphapy"]
description = "Alphapy control panel (dashboard.alphapy.innersync.tech) — guild admin + public status"

[[repos]]
id = "website"
path = "alphapy-website"
role = "frontend"
tags = [
  "frontend",
  "marketing",
  "pricing",
  "checkout",
  "payments",
  "mollie",
  "discord",
  "oauth",
  "nextjs",
]
depends_on = ["core"]
description = "Alphapy pricing/marketing (pricing.alphapy.innersync.tech) — Discord premium checkout → Core/Mollie"

# ── Docs & Hermit ───────────────────────────────────────────────────────────

[[repos]]
id = "docs"
path = "docs"
role = "docs"
tags = ["docs", "starlight", "astro", "documentation"]
depends_on = []
description = "Published docs (docs.innersync.tech) — Starlight; Alphapy stubs from upstream"

[[repos]]
id = "hermit"
path = "Hermit"
role = "agent"
tags = [
  "hermit",
  "skills",
  "agents",
  "memory",
  "vault",
  "vps",
  "strategy",
]
depends_on = ["core"]
description = "Hermit agent/skills host — pushes strategic context & memory-tree to Core (not a Discord bot)"
