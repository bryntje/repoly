# Build release binaries and attach them to a GitHub Release when a version tag is pushed.
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or create a release from an existing tag via the GitHub UI (workflow_dispatch).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS: never

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: repoly-x86_64-unknown-linux-gnu
            bin: repoly
          # Linux aarch64 via cross can flake on first runs; enable later if needed.
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   asset_name: repoly-aarch64-unknown-linux-gnu
          #   bin: repoly
          #   cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: repoly-aarch64-apple-darwin
            bin: repoly
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: repoly-x86_64-apple-darwin
            bin: repoly
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: repoly-x86_64-pc-windows-msvc
            bin: repoly.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/${{ matrix.asset_name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/repoly"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$STAGE/"
          chmod +x "$STAGE/repoly"
          tar -C dist -czf "dist/${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"
          (cd dist && shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/${{ matrix.asset_name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/repoly.exe"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$STAGE/"
          (cd dist && zip -r "${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}")
          (cd dist && sha256sum "${{ matrix.asset_name }}.zip" > "${{ matrix.asset_name }}.zip.sha256" || shasum -a 256 "${{ matrix.asset_name }}.zip" > "${{ matrix.asset_name }}.zip.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Install

            Download the archive for your platform, extract, and put `repoly` on your `PATH`.

            Verify checksums with the matching `.sha256` file.

            See [CHANGELOG.md](https://github.com/bryntje/repoly/blob/master/CHANGELOG.md) for details.

            ### From crates.io (after publish)

            ```bash
            cargo install repoly
            ```
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
