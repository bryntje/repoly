[package]
name = "poly"
version = "0.1.0"
edition = "2021"
description = "Multi-repo workspace awareness for the terminal — status and agent-ready context packs"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bryntje/poly"
keywords = ["polyrepo", "multi-repo", "git", "cli", "workspace"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "poly"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.3"

[dev-dependencies]
tempfile = "3"
