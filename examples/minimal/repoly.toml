# Minimal api + web polyrepo for demos and first-run.
# Paths are relative to this file.
schema_version = 1

[workspace]
name = "minimal"

[context]
always = ["docs/PLATFORM.md"]
max_chars = 24000
# repo_reserve_pct = 40
# always_max_chars = 12000

# Optional safety defaults (MCP host flags still override)
# [policy]
# skip_globs = ["**/.npmrc"]
# exec_timeout_secs = 120
# exec_max_output_bytes = 262144

# Optional plan/ctx synonym groups (merged with built-ins)
# [ranking]
# synonym_groups = [
#   ["billing", "invoice", "stripe"],
# ]

[[repos]]
id = "api"
path = "api"
role = "api"
tags = ["backend", "payments", "oauth", "identity"]
description = "HTTP API"

[[repos]]
id = "web"
path = "web"
role = "frontend"
tags = ["frontend", "oauth", "login"]
depends_on = ["api"]
description = "Web UI"
